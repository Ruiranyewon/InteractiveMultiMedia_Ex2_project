<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오프라인 · QuizUp 상식</title>
  <style>
    :root { color-scheme: light dark; --bg:#f4f5fb; --fg:#111827; --muted:#4b5563; --brand:#4338ca; --brand-ink:#fff; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b1020; --fg:#f3f4f6; --muted:#b4bdce; --brand:#a5b4fc; --brand-ink:#1e1b4b; } }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif; text-align:center; padding:24px; }
    main { max-width:28rem; }
    h1 { font-size:1.5rem; margin:.5rem 0; }
    p { color:var(--muted); line-height:1.6; }
    button { min-height:48px; padding:0 24px; border:0; border-radius:12px; background:var(--brand); color:var(--brand-ink); font-size:1rem; font-weight:700; cursor:pointer; }
    button:focus-visible { outline:3px solid currentColor; outline-offset:3px; }
  </style>
</head>
<body>
  <main>
    <p aria-hidden="true" style="font-size:3rem;margin:0">📡</p>
    <h1>인터넷에 연결되어 있지 않아요</h1>
    <p>상식 퀴즈는 점수를 서버에서 계산하기 때문에 게임을 하려면 인터넷 연결이 필요해요. 연결을 확인한 뒤 다시 시도해 주세요.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </main>
</body>
</html>
